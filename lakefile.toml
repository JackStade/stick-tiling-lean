name = "Tiling"
defaultTargets = ["Tiling"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.31.0"

# Third-party Wang-tiling development, imported (not copied) as a dependency.
# https://github.com/edemaine/lean-wang
[[require]]
name = "lean_wang"
git = "https://github.com/edemaine/lean-wang.git"
rev = "6e8d739b1708c8c43ef320147b7c20cb073269ca"

[[lean_lib]]
name = "Tiling"
globs = ["Tiling.+"]
